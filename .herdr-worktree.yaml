# yaml-language-server: $schema=https://raw.githubusercontent.com/dkarter/hwt/v0.6.2-dev.20260912.5.1.ga6e2a1d/schema/herdr-worktree.schema.json
agent: opencode2
ticket_command: [bin/hwt-ticket]
review_command: [tuicr]
worktree_dir: ../
worktree_naming: full
worktree_prefix: hwt-blog-

urls:
  local: http://web.{hostname}
  preview: https://pr-{pr_number}.hwt-phoenix-blog.example.invalid
  branch-preview: https://{sanitized_branch}.hwt-phoenix-blog.example.invalid
  ticket: https://linear.app/srms/issue/{ticket.identifier}
  database: postgresql://postgres:postgres@localhost:54329/{database.name}
  repository: https://github.com/dkarter/{repository}

metadata:
  commands:
    database: [bin/hwt-database-metadata]

ports:
  start: 4100
  end: 4199
  services: [web]

local_dns:
  enabled: true
  domain: hwt.test

environment:
  variables:
    PORT: ${HWT_PORT_WEB}
    DATABASE_NAME: hwt_phoenix_blog_${HWT_PORT_WEB}
    DATABASE_HOSTNAME: localhost
    DATABASE_PORT: '54329'
    DATABASE_USERNAME: postgres
    DATABASE_PASSWORD: postgres

files:
  copy_on_write: true
  copy:
    - deps
    - _build

post_create:
  - ./bin/install-tools
  - ./bin/setup
